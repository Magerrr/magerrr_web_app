<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Magerrr — Patungan (Host)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2C2E2A;text-decoration:none}a:hover{color:#2C2E2A}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E4; font-family: Inter, system-ui, sans-serif; color: #2C2E2A; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Detail.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 50px; background: #FFFFFF; border: 1px solid #2C2E2A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C2E2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div style="flex-grow: 1"><div style="font-size: 12px; color: #2C2E2A">Kamu host · Badminton Santai</div><div style="font-family: Inter, sans-serif; font-weight: 500; font-size: 20px; letter-spacing: -0.04em">Status Patungan</div></div>
    </div>
    <div style="border-radius: 20px; background: #2C2E2A; color: #F5F1E4; padding: 14px 18px; display: flex; align-items: center; gap: 18px">
      <svg width="88" height="88" viewBox="0 0 104 104" fill="none" aria-label="5 dari 8 pemain sudah bayar">
        <circle cx="52" cy="52" r="42" stroke="#000000" stroke-width="14"/>
        <circle cx="52" cy="52" r="42" stroke="#8ED462" stroke-width="14" stroke-linecap="round" stroke-dasharray="164.9 263.9" transform="rotate(-90 52 52)"/>
        <text x="52" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#FFFFFF">5/8</text>
        <text x="52" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#F5F1E4">lunas</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; color: #F5F1E4">Terkumpul</div>
        <div style="font-family: Inter, sans-serif; font-weight: 500; font-size: 26px; letter-spacing: -0.04em">Rp175.000</div>
        <div style="font-size: 12.5px; color: #F5F1E4">dari Rp280.000 · kurang Rp105.000</div>
      </div>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start; border-radius: 20px; background: transparent; outline: 1px solid #2BA0FF; outline-offset: -1px; padding: 12px 14px; font-size: 12.5px; line-height: 1.5; color: #2C2E2A">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2C2E2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/></svg>
      <div>Dana aman di Magerrr &amp; cair ke rekening kamu 1 jam setelah mabar selesai.</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-weight: 500; font-size: 15px">Pemain</div><div style="font-size: 12.5px; color: #2C2E2A">Rp35.000/orang</div></div>
    <div style="border-radius: 20px; background: #FFFFFF; border: 1px solid #2C2E2A; display: flex; flex-direction: column">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid #D5D5D4">
          <div style="{{p.avatar}}">{{p.ini}}</div>
          <div style="flex-grow: 1; font-size: 14px; font-weight: 500">{{p.name}}</div>
          <sc-if value="{{p.paid}}" hint-placeholder-val="{{ true }}"><div style="padding: 4px 8px; border-radius: 50px; background: #8ED462; color: #2C2E2A; font-size: 11.5px; font-weight: 500">Lunas</div></sc-if>
          <sc-if value="{{p.unpaid}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{p.nudge}}" style="{{p.btn}}">{{p.btnLabel}}</button></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 28px; background: #FFFFFF; border-top: 1px solid #D5D5D4; display: flex; gap: 10px">
    <button type="button" style="height: 54px; padding: 0 16px; border-radius: 50px; border: 1.5px solid #2C2E2A; background: #FFFFFF; font-weight: 500; font-size: 13.5px; color: #2C2E2A">Talangi sisa</button>
    <button type="button" onClick="{{nudgeAll}}" style="flex-grow: 1; height: 54px; border-radius: 50px; border: none; background: #2C2E2A; color: #F5F1E4; font-weight: 500; font-size: 15px">Ingatkan semua yang belum</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { nudged: {} }; }
  renderVals() {
    const raw = [['RA','Raka (kamu)','#FF705D',1],['DM','Dimas','#2C2E2A',1],['SN','Sinta','#8C5A3C',1],['FK','Fikri','#2C2E2A',1],['AL','Alya','#2C2E2A',1],['YP','Yoga','#2C2E2A',0],['BW','Bayu','#2C2E2A',0],['NR','Nara','#2C2E2A',0]];
    const nudged = this.state.nudged;
    const people = raw.map(([ini, name, c, paid]) => {
      const done = !!nudged[ini];
      return {
        ini, name, paid: !!paid, unpaid: !paid,
        avatar: 'width: 30px; height: 30px; border-radius: 50%; color: #F5F1E4; font-size: 11.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; background: ' + c,
        btnLabel: done ? 'Terkirim' : 'Ingatkan',
        btn: 'height: 30px; padding: 0 12px; border-radius: 9px; font-size: 12px; font-weight: 500; ' + (done ? 'background: #F5F1E4; color: #2C2E2A; border: none;' : 'background: transparent; outline: 1px solid #FF705D; outline-offset: -1px; color: #2C2E2A; border: none;'),
        nudge: () => this.setState({ nudged: { ...nudged, [ini]: true } })
      };
    });
    return { people, nudgeAll: () => this.setState({ nudged: { YP: true, BW: true, NR: true } }) };
  }
}
</script>
</body>
</html>
